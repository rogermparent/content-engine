services:
  shard-1:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    image: content-engine-playwright:latest
    environment:
      SHARD_INDEX: "1"
      SHARD_TOTAL: "${SHARD_TOTAL:-4}"
      PLAYWRIGHT_ARGS: "${PLAYWRIGHT_ARGS:-}"
      CI: "true"
    volumes:
      - ./blob-reports:/app/websites/recipe-website/editor/blob-report
      - ./websites/recipe-website/editor/playwright/tests/__screenshots__:/app/websites/recipe-website/editor/playwright/tests/__screenshots__

  shard-2:
    image: content-engine-playwright:latest
    depends_on:
      - shard-1
    environment:
      SHARD_INDEX: "2"
      SHARD_TOTAL: "${SHARD_TOTAL:-4}"
      PLAYWRIGHT_ARGS: "${PLAYWRIGHT_ARGS:-}"
      CI: "true"
    volumes:
      - ./blob-reports:/app/websites/recipe-website/editor/blob-report
      - ./websites/recipe-website/editor/playwright/tests/__screenshots__:/app/websites/recipe-website/editor/playwright/tests/__screenshots__

  shard-3:
    image: content-engine-playwright:latest
    depends_on:
      - shard-1
    environment:
      SHARD_INDEX: "3"
      SHARD_TOTAL: "${SHARD_TOTAL:-4}"
      PLAYWRIGHT_ARGS: "${PLAYWRIGHT_ARGS:-}"
      CI: "true"
    volumes:
      - ./blob-reports:/app/websites/recipe-website/editor/blob-report
      - ./websites/recipe-website/editor/playwright/tests/__screenshots__:/app/websites/recipe-website/editor/playwright/tests/__screenshots__

  shard-4:
    image: content-engine-playwright:latest
    depends_on:
      - shard-1
    environment:
      SHARD_INDEX: "4"
      SHARD_TOTAL: "${SHARD_TOTAL:-4}"
      PLAYWRIGHT_ARGS: "${PLAYWRIGHT_ARGS:-}"
      CI: "true"
    volumes:
      - ./blob-reports:/app/websites/recipe-website/editor/blob-report
      - ./websites/recipe-website/editor/playwright/tests/__screenshots__:/app/websites/recipe-website/editor/playwright/tests/__screenshots__
