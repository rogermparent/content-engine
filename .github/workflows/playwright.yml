name: Playwright Tests

on:
  push:
    branches: [main, playwright]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Recipe (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    container:
      # Must match @playwright/test in the workspace — Playwright refuses to run
      # against a mismatched browser bundle. This was pinned to v1.50.0-jammy
      # while Dockerfile.playwright used v1.59.1-noble and the two sites'
      # devDependencies disagreed with both.
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        # The CI container carries no git identity, and `init.defaultBranch`
        # decides what a bundle clone checks out: `git-test-content/test-git.bundle`
        # holds only `refs/heads/main`, so a container defaulting to `master`
        # checks out nothing and git.spec fails on an empty page.
        run: |
          git config --global user.name "Playwright Tester"
          git config --global user.email "playwright@example.com"
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Enable pnpm
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Playwright tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        working-directory: websites/recipe-website/editor
        run: |
          pnpm exec playwright test \
            --project=e2e \
            --project=mobile \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} \
            --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: websites/recipe-website/editor/blob-report
          retention-days: 14

  portfolio:
    name: Portfolio
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    steps:
      - uses: actions/checkout@v4

      - name: Configure git
        # The CI container carries no git identity, and `init.defaultBranch`
        # decides what a bundle clone checks out: `git-test-content/test-git.bundle`
        # holds only `refs/heads/main`, so a container defaulting to `master`
        # checks out nothing and git.spec fails on an empty page.
        run: |
          git config --global user.name "Playwright Tester"
          git config --global user.email "playwright@example.com"
          git config --global init.defaultBranch main
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Enable pnpm
        run: corepack enable

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Unsharded on purpose: portfolio's suite is a fraction of recipe's, so
      # four containers would spend more time starting up than testing.
      - name: Run Playwright tests
        working-directory: websites/portfolio/editor
        run: |
          pnpm exec playwright test \
            --project=e2e \
            --project=mobile \
            --reporter=blob

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-portfolio
          path: websites/portfolio/editor/blob-report
          retention-days: 14

  merge-reports:
    name: Merge sharded reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Recipe's shards only — the numeric pattern excludes
      # `blob-report-portfolio`. Merging it in would interleave two unrelated
      # suites into a single HTML report.
      - name: Download all blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-[0-9]*
          merge-multiple: true

      - name: Merge into a single HTML report
        working-directory: websites/recipe-website/editor
        run: pnpm exec playwright merge-reports --reporter=html,github ../../../all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: websites/recipe-website/editor/playwright-report
          retention-days: 14
